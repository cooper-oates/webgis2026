<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 7: OpenLayers and Leaflet State Maps</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.2.1/ol.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol-layerswitcher@4.1.2/dist/ol-layerswitcher.css">
<style>
body { margin: 20px; font-family: Arial, sans-serif; }
.map-section { margin-bottom: 32px; }
.map-frame { width: 100%; height: 500px; }
#iowa-map { height: 500px; }
.nc-layer-control { position:absolute; top:10px; left:10px; z-index:1000; background:rgba(255,255,255,.9); padding:6px 8px; border-radius:4px; box-shadow:0 1px 5px rgba(0,0,0,.4); font:12px/1.5 Arial,sans-serif; color:#333; }
.nc-layer-control label { display:block; white-space:nowrap; cursor:pointer; }
.nc-layer-control input { margin:0 4px 0 0; vertical-align:middle; }
.nc-map-wrap { position:relative; }
</style>
</head>
<body>
<h2>Chapter 7: Web-based Mapping Lab</h2>
<h3>Author: Cooper Oates</h3>

<section class="map-section">
<h3>Question 2 and 3: North Carolina (OpenLayers)</h3>
<div class="nc-map-wrap"><div id="nc-map" class="map-frame"></div><div id="nc-layer-control" class="nc-layer-control"></div></div>
</section>

<section class="map-section">
<h3>Question 5 and 6: Iowa (Leaflet)</h3>
<div id="iowa-map" class="map-frame"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/ol@v10.2.1/dist/ol.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
// NORTH CAROLINA MAP - OPENLAYERS (Questions 2 and 3)
(function () {
  var latitude = 35.306840;
  var longitude = -80.73200;
  var latlong = ol.proj.fromLonLat([longitude, latitude]);
  var zoomLevel = 7;

  var osm = new ol.layer.Tile({
    title: 'OpenStreetMap', type: 'base', visible: true,
    source: new ol.source.OSM()
  });
  var googleMap = new ol.layer.Tile({
    title: 'Google Map', type: 'base', visible: false,
    source: new ol.source.XYZ({
      url: 'https://mt{0-3}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&key=AIzaSyDOx0u4G8taPLVhjL7ownU4jH6EJYWRMj8'
    })
  });
  var basegroup = new ol.layer.Group({ title: 'Base Maps', layers: [osm, googleMap] });
  var overlaygroup = new ol.layer.Group({ title: 'Overlay', layers: [] });

  var ncMap = new ol.Map({
    target: 'nc-map', layers: [basegroup, overlaygroup],
    view: new ol.View({ center: latlong, zoom: zoomLevel })
  });
  var statesSource = new ol.source.Vector({
    url: 'https://raw.githubusercontent.com/PublicaMundi/MappingAPI/refs/heads/master/data/geojson/us-states.json',
    format: new ol.format.GeoJSON()
  });
  var stateStyle = new ol.style.Style({
    fill: new ol.style.Fill({ color: 'rgba(255,255,255,0.08)' }),
    stroke: new ol.style.Stroke({ color: '#d62728', width: 3 })
  });
  var ncStateLayer = new ol.layer.Vector({
    title: 'North Carolina Boundary', source: statesSource, style: stateStyle
  });
  overlaygroup.getLayers().push(ncStateLayer);
  statesSource.once('change', function () {
    if (statesSource.getState() === 'ready') {
      var features = statesSource.getFeatures().filter(function (feature) {
        var props = feature.getProperties();
        return props.name === 'North Carolina' || props.NAME === 'North Carolina';
      });
      if (features.length) {
        var ncFeature = features[0].clone();
        ncFeature.getGeometry().transform('EPSG:4326', ncMap.getView().getProjection());
        ncMap.getView().fit(ncFeature.getGeometry().getExtent(), { padding: [30, 30, 30, 30], maxZoom: 8 });
      }
    }
  });

  var ncCounties = new ol.layer.Vector({
    title: 'North Carolina Counties (GeoJSON)',
    source: new ol.source.Vector({
      url: 'https://gis.rowancountync.gov/arcgis/rest/services/Public/NC_Counties_Information/MapServer/0/query?where=1%3D1&outFields=*&returnGeometry=true&outSR=4326&f=geojson',
      format: new ol.format.GeoJSON()
    }),
    style: new ol.style.Style({
      fill: new ol.style.Fill({ color: 'rgba(255,255,255,0)' }),
      stroke: new ol.style.Stroke({ color: '#2369a1', width: 1.2 })
    })
  });
  overlaygroup.getLayers().push(ncCounties);

  // Layer options styled to match the Leaflet layer control below.
  var control = document.getElementById('nc-layer-control');
  control.innerHTML =
    '<label><input type="radio" name="nc-base" value="osm" checked> OpenStreetMap</label>' +
    '<label><input type="radio" name="nc-base" value="google"> Google Map</label>' +
    '<label><input type="checkbox" id="nc-state-toggle" checked> North Carolina State Boundary</label>' +
    '<label><input type="checkbox" id="nc-counties-toggle" checked> North Carolina Counties (GeoJSON)</label>';

  control.querySelectorAll('input[name="nc-base"]').forEach(function (input) {
    input.addEventListener('change', function () {
      osm.setVisible(input.value === 'osm');
      googleMap.setVisible(input.value === 'google');
    });
  });
  document.getElementById('nc-state-toggle').addEventListener('change', function (event) {
    ncStateLayer.setVisible(event.target.checked);
  });
  document.getElementById('nc-counties-toggle').addEventListener('change', function (event) {
    ncCounties.setVisible(event.target.checked);
  });

  window.addEventListener('load', function () { ncMap.updateSize(); });
})();
</script>

<script>
// IOWA MAP - LEAFLET (Questions 5 and 6)
(function () {
  var latlng = [42.0, -93.5];
  var zoomLevel = 7;
  var iowaMap = L.map('iowa-map').setView(latlng, zoomLevel);
  var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(iowaMap);
  var layerControl = L.control.layers(null, null, { collapsed: false }).addTo(iowaMap);
  layerControl.addBaseLayer(osm, 'OpenStreetMap');

  fetch('https://raw.githubusercontent.com/PublicaMundi/MappingAPI/refs/heads/master/data/geojson/us-states.json')
    .then(function (response) { return response.json(); })
    .then(function (data) {
      var iowa = data.features.filter(function (feature) {
        return feature.properties.name === 'Iowa' || feature.properties.NAME === 'Iowa';
      });
      var iowaState = L.geoJSON({ type: 'FeatureCollection', features: iowa }, {
        style: { color: '#d62728', weight: 3, fillOpacity: 0.05 }
      }).addTo(iowaMap);
      layerControl.addOverlay(iowaState, 'Iowa State Boundary');
      if (iowaState.getBounds().isValid()) { iowaMap.fitBounds(iowaState.getBounds()); }
    });

  var iowaCountiesUrl = 'https://services.arcgis.com/8lRhdTsQyJpO52F1/arcgis/rest/services/County_View/FeatureServer/0/query?where=1%3D1&outFields=*&returnGeometry=true&outSR=4326&f=geojson';
  fetch(iowaCountiesUrl)
    .then(function (response) { return response.json(); })
    .then(function (data) {
      var counties = L.geoJSON(data, {
        style: { color: '#2369a1', weight: 1, fillOpacity: 0 }
      }).addTo(iowaMap);
      layerControl.addOverlay(counties, 'Iowa Counties (GeoJSON)');
    });
})();
</script>
</body>
</html>
